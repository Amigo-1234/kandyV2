<script>/* Theme before first paint: an explicit choice wins over the system preference. Inline and synchronous ON PURPOSE — a deferred script would let the wrong theme paint first. */(function(){try{var t=localStorage.getItem("kt.theme");if(t!=="dark"&&t!=="light"){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
